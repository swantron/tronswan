name: React App CI/CD with Coverage and Playwright

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Coverage Summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Coverage**: ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "Current coverage: ${{ steps.coverage.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY

  deploy-and-validate:
    runs-on: ubuntu-latest
    needs: build-test-coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # keyless: GitHub's OIDC token is exchanged for the tronswan-deploy service account
    env:
      IMAGE: us-central1-docker.pkg.dev/tronswan/tronswan-repo/tronswan
    steps:
      - name: Checkout code for the image
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/953953098008/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: tronswan-deploy@tronswan.iam.gserviceaccount.com
          project_id: tronswan

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build \
            --build-arg VITE_WEATHER_API_KEY="${{ secrets.VITE_WEATHER_API_KEY }}" \
            --build-arg VITE_GOOGLE_DOCS_API_KEY="${{ secrets.VITE_GOOGLE_DOCS_API_KEY }}" \
            --build-arg VITE_SPOTIFY_CLIENT_ID="${{ vars.VITE_SPOTIFY_CLIENT_ID }}" \
            -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:${GITHUB_SHA::7}"

      - name: Deploy to Cloud Run
        # Scales to zero; max 3 instances caps the bill if something hammers it.
        # Secrets come from Secret Manager, readable only by tronswan-run.
        run: |
          gcloud run deploy tronswan \
            --image "$IMAGE:${GITHUB_SHA::7}" \
            --region us-central1 \
            --service-account tronswan-run@tronswan.iam.gserviceaccount.com \
            --memory 512Mi --cpu 1 --concurrency 80 \
            --min-instances 0 --max-instances 3 \
            --update-env-vars GITHUB_OWNER=swantron,SPOTIFY_CLIENT_ID=${{ vars.VITE_SPOTIFY_CLIENT_ID }},WATCHTRON_OTLP_ENDPOINT=https://watch.swantron.com,WATCHTRON_SERVICE_NAME=tronswan-web \
            --update-secrets SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,WATCHTRON_TOKEN=watchtron-token:latest \
            --quiet

      - name: Deploy Firebase Hosting (CDN and tronswan.com in front of Cloud Run)
        run: npx --yes firebase-tools@14 deploy --only hosting --project tronswan --non-interactive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: |
          echo 'Running full Playwright test suite against deployed site...'
          yarn test:e2e

  # Post-deploy gate: drive synthetic traffic at the live URL and fail if the
  # white-box telemetry didn't land in the watchtron control plane (proves the
  # deploy is actually serving instrumented traffic end-to-end).
  watchtron-verify:
    needs: deploy-and-validate
    uses: swantron/watchtron/.github/workflows/verify.yml@main
    with:
      service: tronswan
    secrets:
      otlp_endpoint: ${{ secrets.WATCHTRON_OTLP_ENDPOINT }}
      token: ${{ secrets.WATCHTRON_TOKEN }}
